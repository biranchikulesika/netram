# Netram local development infrastructure.
#
# This file provides the SUPPORT SERVICES the platform depends on. The
# application services (api, web, realtime, ...) are orchestrated through
# pnpm/Turborepo during development (see README.md).
#
# Service applications can also be containerized individually (see each
# service's Dockerfile). To run the full stack through Docker, start every
# component with its own profile.

name: netram

services:
  postgres:
    image: postgres:16-alpine
    container_name: netram-postgres
    environment:
      POSTGRES_USER: netram
      POSTGRES_PASSWORD: netram
      POSTGRES_DB: netram
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netram -d netram"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: netram-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: netram-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: netram
      MINIO_ROOT_PASSWORD: netram-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: netram-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 netram netram-secret &&
      mc mb --ignore-existing local/netram &&
      echo 'MinIO bucket ready'
      "

  # =================================================================
  # Application Services (Profile: "full")
  # Run backing infra with: pnpm infra:up
  # Run full containerized stack with: docker compose --profile full up -d
  # =================================================================

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: netram-api
    profiles: ["full", "services"]
    environment:
      DATABASE_URL: postgres://netram:netram@postgres:5432/netram
      REDIS_URL: redis://redis:6379
      NETRAM_API_PORT: 3001
      NETRAM_DEV_AUTH_SECRET: dev-only-secret-00000000000000000000000000000000
      NETRAM_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      NETRAM_OBJECT_STORAGE_ACCESS_KEY: netram
      NETRAM_OBJECT_STORAGE_SECRET_KEY: netram-secret
      NETRAM_OBJECT_STORAGE_BUCKET: netram
      NETRAM_OBJECT_STORAGE_USE_SSL: "false"
      # Server-to-server reachability into the compose network (NOT the
      # browser-facing URL the gateway mints into relay links).
      NETRAM_CCTV_GATEWAY_URL: http://cctv-gateway:3003
      # Must match the gateway's secret: relay tokens are signed/verified across services.
      NETRAM_CCTV_STREAM_SECRET: ${NETRAM_CCTV_STREAM_SECRET:-replace-me-with-a-32-char-plus-cctv-stream-secret}
      # Service-to-service secret presented to the CCTV gateway (§14).
      NETRAM_CCTV_SERVICE_SECRET: ${NETRAM_CCTV_SERVICE_SECRET:-replace-me-with-a-32-char-plus-cctv-service-secret}
      # MediaMTX external auth hook secret (Phase 4): must match the gateway.
      NETRAM_MEDIAMTX_HOOK_SECRET: ${NETRAM_MEDIAMTX_HOOK_SECRET:-replace-me-with-a-32-char-plus-mediamtx-hook-secret}
    extra_hosts:
      # MediaMTX (host-published ports) reaches the hook through the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  workers:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: netram-workers
    profiles: ["full", "services"]
    command: ["pnpm", "workers"]
    environment:
      DATABASE_URL: postgres://netram:netram@postgres:5432/netram
      REDIS_URL: redis://redis:6379
      NETRAM_DEV_AUTH_SECRET: dev-only-secret-00000000000000000000000000000000
      NETRAM_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      NETRAM_OBJECT_STORAGE_ACCESS_KEY: netram
      NETRAM_OBJECT_STORAGE_SECRET_KEY: netram-secret
      NETRAM_OBJECT_STORAGE_BUCKET: netram
      NETRAM_OBJECT_STORAGE_USE_SSL: "false"
      # CCTV stream-session sweeper (Phase 4).
      NETRAM_CCTV_GATEWAY_URL: http://cctv-gateway:3003
      NETRAM_CCTV_SERVICE_SECRET: ${NETRAM_CCTV_SERVICE_SECRET:-replace-me-with-a-32-char-plus-cctv-service-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    container_name: netram-realtime
    profiles: ["full", "services"]
    environment:
      NETRAM_REALTIME_PORT: 3002
      REDIS_URL: redis://redis:6379
      NETRAM_API_URL: http://api:3001
      NETRAM_DEV_AUTH_SECRET: dev-only-secret-00000000000000000000000000000000
    ports:
      - "3002:3002"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  cctv-gateway:
    build:
      context: .
      dockerfile: services/cctv-gateway/Dockerfile
    container_name: netram-cctv-gateway
    profiles: ["full", "services"]
    environment:
      NETRAM_CCTV_GATEWAY_PORT: 3003
      # Browser-facing base for minted relay URLs (published port). Override
      # via .env when the stack must be reachable from other machines (LAN).
      NETRAM_CCTV_GATEWAY_URL: ${NETRAM_CCTV_GATEWAY_URL:-http://localhost:3003}
      # Must match the API's secret: relay tokens are signed/verified across services.
      NETRAM_CCTV_STREAM_SECRET: ${NETRAM_CCTV_STREAM_SECRET:-replace-me-with-a-32-char-plus-cctv-stream-secret}
      # Service-to-service secret the API presents on control-plane calls (§14).
      NETRAM_CCTV_SERVICE_SECRET: ${NETRAM_CCTV_SERVICE_SECRET:-replace-me-with-a-32-char-plus-cctv-service-secret}
      # Internal MediaMTX control API over the compose network.
      NETRAM_MEDIAMTX_API_URL: http://netram-media:9997
      NETRAM_MEDIAMTX_API_USERNAME: ${NETRAM_MEDIAMTX_API_USERNAME:-admin}
      NETRAM_MEDIAMTX_API_PASSWORD: ${NETRAM_MEDIAMTX_API_PASSWORD:-netram-dev-internal}
      # Browser-facing WHEP base (published port). Distinct from the API URL.
      NETRAM_MEDIAMTX_WHEP_PUBLIC_URL: ${NETRAM_MEDIAMTX_WHEP_PUBLIC_URL:-http://localhost:8189}
      # Dev-only ingest override: route provisioning at the rig's facility feed.
      NETRAM_MEDIAMTX_DEV_INGEST_SOURCE: rtsp://facility-nvr:8554/facility-vani/cam-gate
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_started

  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: netram-ai
    profiles: ["full", "services"]
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: netram-web
    profiles: ["full", "web"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_REALTIME_WS_URL: ws://localhost:3002
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      realtime:
        condition: service_started

  # =================================================================
  # CCTV Media Pipeline (Profiles: "media", "facility") — Phase 1/2 dev rig
  # Development-only simulation of the target architecture (see
  # docs/history/cctv-target-architecture.md and
  # docs/history/cctv-phase-1-2.md):
  #   facility FFmpeg camera --RTSP--> MediaMTX --WHEP/HLS--> browser
  # The MP4 is only ever an FFmpeg input, never a browser source.
  # =================================================================

  # NETRAM-side media server (data plane). Serves WHEP (WebRTC) + HLS to the
  # browser through the same-origin Next.js proxy. Pulls the simulated camera
  # on demand across the network boundary (pilot topology).
  netram-media:
    image: bluenviron/mediamtx:latest
    container_name: netram-media
    profiles: ["media", "facility"]
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro,Z
    environment:
      # Phase 4: the external auth hook endpoint. MTX_ env vars override the
      # config file (MediaMTX does not env-substitute the YAML itself). Points
      # at the API through the HOST bridge gateway so the hook works whether
      # the API runs in compose or on the host. The hook secret is embedded as
      # a query parameter because MediaMTX cannot send custom headers.
      # Override MEDIAMTX_HOOK_BASE in the environment when the API lives
      # elsewhere; keep the secret in sync with the API's
      # NETRAM_MEDIAMTX_HOOK_SECRET.
      MTX_AUTHHTTPADDRESS: ${MEDIAMTX_HOOK_BASE:-http://172.20.0.1:3001}/media/auth?hookSecret=${NETRAM_MEDIAMTX_HOOK_SECRET:-replace-me-with-a-32-char-plus-mediamtx-hook-secret}
    ports:
      # WebRTC/ICE (UDP) must be reachable by the browser's RTCPeerConnection.
      - "8189:8189/udp"
      # HLS segments (dev only; the browser normally uses the same-origin
      # proxy route instead of this direct port).
      - "8888:8888"
      # WHEP signaling HTTP + WebRTC ICE (dev only). Browsers reach WHEP
      # through the same-origin Next.js proxy route; this publish exists so
      # the Next.js server (host-run during dev) can reach the endpoint.
      # TCP carries signaling, UDP carries media (ICE).
      - "8189:8189"
      - "8189:8189/udp"
      # RTSP read/pull side. Dev-only: in the real topology this port is never
      # publicly exposed — it is only needed here so MediaMTX can accept the
      # push-mode demo and for local ffprobe verification of pull mode.
      - "8554:8554"
      # Control REST API (Phase 3 gateway bridge). Published for host-run dev
      # verification only; in deployment the gateway reaches this over the
      # internal network and the port stays unpublished.
      - "9997:9997"
    networks:
      - default
      - facility

  # Simulated remote facility. Topology inside the boundary mirrors a real
  # site: the FFmpeg "camera" registers itself with the facility NVR (an RTSP
  # server); NETRAM's media server pulls from the NVR across the network
  # boundary on demand (pilot topology).
  camera-sim:
    build:
      context: ./infra/facility-sim
    image: netram-camera-sim:dev
    container_name: netram-camera-sim
    profiles: ["facility"]
    environment:
      CAMERA_MODE: ${NETRAM_CCTV_SIM_MODE:-pull}
      SAMPLE_VIDEO: /media/sample.mp4
    volumes:
      - ./services/cctv-gateway/samples/boys-at-lab.mp4:/media/sample.mp4:ro,Z
    networks:
      - facility
    depends_on:
      - facility-nvr
    restart: unless-stopped

  # Facility NVR stand-in: accepts the camera's RTSP push INSIDE the facility
  # network only (no route into NETRAM infra, no host ports). This is what
  # netram-media pulls — exactly like a real site's NVR.
  facility-nvr:
    image: bluenviron/mediamtx:latest
    container_name: netram-facility-nvr
    profiles: ["facility"]
    volumes:
      - ./infra/facility-sim/nvr.yml:/mediamtx.yml:ro,Z
    networks:
      - facility
    restart: unless-stopped

networks:
  # Logical "remote facility" network. The camera simulator lives here;
  # MediaMTX is the only member bridging into NETRAM infra (default network).
  facility: {}

volumes:
  db-data:
  minio-data:


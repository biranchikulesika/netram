[project]
name = "netram-ai"
version = "0.1.0"
description = "Netram AI service - advisory inference and anomaly detection"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "pydantic>=2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
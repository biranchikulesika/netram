# Netram bootstrap vhost — netram.kulesika.in (HTTP only, pre-certificate)
#
# WHY THIS EXISTS: nginx refuses to start if an ssl_certificate path does not
# resolve. The final vhost (netram.conf) points at a Let's Encrypt certificate
# that does not exist yet, so it cannot be installed first. This file serves the
# ACME HTTP-01 challenge over plain HTTP so `certbot certonly --webroot` can
# obtain the certificate.
#
# scripts/deploy-nginx.sh installs THIS file, runs certbot, then replaces it
# with netram.conf. It is a bootstrap step, not the steady state.
#
# It still proxies real traffic over HTTP so the site is reachable (plaintext)
# during certificate issuance.

server {
    listen 80;
    listen [::]:80;
    server_name netram.kulesika.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Plaintext proxy during bootstrap. Replaced by the redirect-to-HTTPS in
    # netram.conf once the certificate is in place.
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

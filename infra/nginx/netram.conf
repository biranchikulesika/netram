# Netram public edge - netram.kulesika.in
#
# Installed to /etc/nginx/sites-available/netram + symlinked into
# sites-enabled by scripts/deploy-nginx.sh. The host already runs nginx for
# other tenants, so this file is ONE MORE SERVER BLOCK on the existing :80/:443
# listeners (vhosts are selected by SNI/Host, not by owning the port). It
# deliberately does NOT declare default_server - the existing default vhost on
# port 80 belongs to another tenant and must keep serving unknown Host headers.
#
# Role split:
#   netram.kulesika.in/*    → 127.0.0.1:3100  (web container, Next.js BFF)
#   netram.kulesika.in/ws   → 127.0.0.1:3202  (realtime container, WebSocket)
#
# /ws must bypass the BFF because it is a WebSocket upgrade. Everything else -
# pages, the same-origin /api/* BFF, and the CCTV media proxies - goes to the web
# container, which proxies server-side to the API and MediaMTX.
#
# The Fastify API has no public port: it is only reachable from the web BFF over
# the podman network.

# Sized for evidence uploads (photos/video captured during inspections) which
# are proxied through the BFF to the API and on to object storage.
client_max_body_size 100m;

upstream netram_web {
    server 127.0.0.1:3100;
    keepalive 32;
}

upstream netram_realtime {
    server 127.0.0.1:3202;
}

server {
    listen 80;
    listen [::]:80;
    server_name netram.kulesika.in;

    # ACME HTTP-01. Must stay on plain HTTP (and not redirect) or renewal breaks.
    # This is also what the bootstrap vhost serves before the cert exists.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name netram.kulesika.in;

    ssl_certificate     /etc/letsencrypt/live/netram.kulesika.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/netram.kulesika.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:NetramTLS:10m;
    ssl_session_timeout 1d;

    # Keep the ACME path reachable over TLS too (certbot --webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ---------------------------------------------------------- realtime /ws
    # Long-lived, upgrade-based. Read timeout must exceed the server-side
    # heartbeat interval or nginx will cut idle connections.
    location /ws {
        proxy_pass http://netram_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }

    # ---------------------------------------------------------- web (pages + BFF)
    location / {
        proxy_pass http://netram_web;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The web app builds same-origin URLs and validates the request origin,
        # so it must see the real scheme and host, not the loopback proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Evidence/media uploads and report generation can be slow.
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    server_tokens off;
}
